<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花火街 · Quest単体 日本語音声試験</title><style>@font-face{font-family:Hanabi;src:url('../fonts/NotoSansJP-variable.ttf')}*{box-sizing:border-box}body{margin:0;background:#080e19;color:#f3f0e7;font:300 19px Hanabi,sans-serif}main{position:relative;z-index:1;max-width:760px;margin:30px auto;padding:24px;border:1px solid #d0a859;border-radius:20px;background:#111c29}h1{font-size:26px;font-weight:400}button{padding:17px;margin:7px 6px 7px 0;font:inherit;border-radius:12px;border:1px solid #9f8958;background:#e6c47c;color:#0b1721;cursor:pointer}button:disabled{opacity:.35}p{line-height:1.8}#status{white-space:pre-wrap;color:#d4e7f1}#result{font-size:26px;color:#ffdc8b;min-height:60px}meter{width:100%}canvas{position:fixed;inset:0;z-index:0}small{color:#adc1ce}.xr main{display:none}</style><main><h1>花火街 · Quest単体 日本語音声試験</h1><p>①音声AIを準備 → ②マイクを許可 → ③MRへ入る → パネルの「8秒話す」を押して、<br>「きれいな金色の花火を、たくさん出してね」と話してください。</p><p><small>最初に音声AIをダウンロードします。録音は押した時だけ。声も認識処理もQuest内で扱い、音声を外部へ送りません。文字と診断結果はこの端末に保存します。</small></p><button id="prepare">① 音声AIを準備</button><button id="mic" disabled>② マイクを許可</button><button id="enter" disabled>③ MRへ入る</button><button id="record" disabled>8秒話す（ブラウザ確認用）</button><button id="stop" disabled>録音を止める</button><button id="release">マイクを終了</button><meter id="meter" min="0" max="1" value="0"></meter><p id="status">試験を準備中…</p><p id="result"></p></main><script type="module" src="./trial.js"></script></html>
